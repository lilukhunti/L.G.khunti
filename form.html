<!DOCTYPE html>
<html lang="en">
<head>
    <form action="form.php" method="POST">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanjeevni Blood Bank Organization</title>
    <header class="navbar">
                
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        
        
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            height: 100vh; 
            display: flex;
            flex-direction: column; 
            overflow: hidden; 
        }

        .navbar {
            background-color: #0b2240;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            justify-content: center;
            padding: 15px 50px;
            width: 100%;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
            gap: 10px;
        }

    
        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            text-align: center;
            width: 100%;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .nav-links .home { background-color: #e74c3c; } 
        .nav-links .about { background-color: #e74c3c; } 
        .nav-links .donor { background-color: #e74c3c; } 
        .nav-links .contact { background-color: #e74c3c; } 


        .nav-links a:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .main-content {
            flex: 1; 
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eef2f7 0%, #dbe2ef 100%);
            width: 100%;
            
        }

    
        .form-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 550px;
            height: 600px;
            box-shadow: 0px 20px 40px rgba(0, 0, 0, 0.12), 
                        0px 10px 20px rgba(0, 0, 0, 0.06);
            text-align: center;
            border-top: 5px solid #e74c3c; 
        }


        .form-container h2 {
            color: #2c3e50;
            font-size: 26px;
            margin-bottom: 25px;
            font-weight: 700;
        }

        
        .form-group {
            margin-bottom: 20px;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid #dcdde1;
            border-radius: 10px;
            font-size: 15px;
            background-color: #f8f9fa;
            outline: none;
            transition: all 0.3s ease;
        }


        .form-group input:focus, 
        .form-group select:focus {
            border-color: #e74c3c;
            background-color: #ffffff;
            box-shadow: 0px 5px 15px rgba(231, 76, 60, 0.15);
        }


        .row {
            display: flex;
            gap: 15px;
            flex-wrap: nowrap;
        }

        .row .form-group {
            flex: 1;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0px 8px 20px rgba(231, 76, 60, 0.3);
            transition: all 0.3s ease;
        }

        .register-btn:hover {
            box-shadow: 0px 12px 24px rgba(231, 76, 60, 0.4);
            transform: translateY(-2px);
        }

        .register-btn:active {
            transform: translateY(0);
            box-shadow: 0px 4px 10px rgba(231, 76, 60, 0.2);
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">SANJEEVNI BLOOD BANK ORGANIZATION</div>
        <ul class="nav-links">
            <li><a href="index.html" class="home">Home</a></li>
            <li><a href="about.html" class="about">About</a></li>
            <li><a href="form.html" class="donor">Become Donor</a></li>
            <li><a href="contact.html" class="contact">Contact</a></li>
        </ul>
    </header>

    <main class="main-content">
        <div class="form-container">
            <h2>Become a Blood Donor</h2>
            
            <form onsubmit="event.preventDefault();">
                <div class="form-group">
                    <input type="text" placeholder="Full Name" required>
                </div>
                
                <div class="form-group">
                    <input type="email" placeholder="Email" required>
                </div>
                
                <div class="form-group">
                    <input type="tel" placeholder="Phone" required>
                </div>
                
                <div class="form-group">
                    <input type="date" required style="color: #7f8c8d;">
                </div>
                
                <div class="row">
                    <div class="form-group">
                        <input type="number" placeholder="Age" min="18" max="65" required>
                    </div>


                    
                    <div class="form-group">
                        <input type="text" placeholder="City/Location" required>
                    </div>

                    
                    
                    <div class="form-group">
                        <select required style="color: #7f8c8d;">
                            <option value="" disabled selected>Blood Group</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                        </select>
                    </div>
                </div>
                <br><br>
                
                <button type="submit" class="register-btn">Register</button><br><br>
            </form>
        </form>
        </div>
    </main>

</body>
</html>
