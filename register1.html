<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <title>Donor Registration</title>
  <link rel="stylesheet" href="style1.css">
</head>
<body>
  <div class="form-container">
    <h2>Become a Blood Donor</h2>
    <form action="#" method="POST">
      <input type="text" placeholder="Full Name" required class="muto-box">
      <input type="email" placeholder="Email" required class="muto-box">
      <input type="tel" placeholder="Phone" required class="muto-box">
      <input type="date" class="muto-box">
      
      <input type="number" placeholder="age" min="18" max="65" class="nano-box">
      
      <select class="nano-box">
        <option disabled selected>Gender</option>
        <option>Male</option>
        <option>Female</option>
      </select>
      
      <select class="nano-box">
        <option disabled selected>Blood Group</option>
        <option>A+</option><option>A-</option>
        <option>B+</option><option>B-</option>
        <option>O+</option><option>O-</option>
      </select>
      
      <button type="submit" class="submit-btn">Register</button>
      <br><br>
      <a href="index.html" class="back-link">← Back to Home</a>
    </form>
  </div>
</body>
</html>
