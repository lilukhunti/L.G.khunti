<title>Donor Registration</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2 align="center" style="color:black;">Become a Blood Donor</h2>

<form action="register.php" method="POST" align="center">

<input type="text" name="name" placeholder="Full Name" required><br><br>
<input type="email" name="email" placeholder="Email" required><br><br>
<input type="text" name="phone" placeholder="Phone" required><br><br>
<input type="date" name="donation_date"><br><br>
<input type="number" name="age" min="18" max="60"><br><br>


<select name="gender"><br><br>
    <option>male</option>
    <option>female</option>
</select><br><br>

<select name="bloodgroup">

<option>A+</option>

<option>A-</option>

<option>B+</option>

<option>B-</option>

<option>O+</option>

<option>O-</option>

<option>AB+</option>

<option>AB-</option>

</select>

<br><br>

<input type="submit" value="Register">

</form>

</body>
