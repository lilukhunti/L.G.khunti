<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Blood - Sanjeevani Blood Bank</title>
    <link rel="stylesheet" href="request.css">
    
</head>
<body>


    <header>
        <nav>
            <h2><u>SANJEEVANI BLOOD BANK ORGANIZATION</u></h2>
            <div class="nav-links">
                <a href="Index.html" class="btn">Home</a>
                <a href="about.html" class="btn">About</a>
                <a href="Form.html" class="btn">Register Donor</a> 
                <a href="contact.html" class="btn">Contact</a>
            </div>
        </nav>
    </header>
    <main class="full-screen-wrapper">

    <div class="container" style="margin-top: 50px;">
        <div class="form-container">
            <h2>Request Blood</h2>
            
            <form action="#" method="POST">
                
                <div class="form-group">
                    <label for="patient_name">Patient Name</label>
                    <input type="text" class="form-control" id="patient_name" name="patient_name" placeholder="Enter patient's full name" required>
                </div>

                <div class="form-group">
                    <label for="blood_group">Required Blood Group</label>
                    <select class="form-control" id="blood_group" name="blood_group" required>
                        <option value="" disabled selected>-- Select Blood Group --</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="units">Units Required</label>
                    <input type="number" class="form-control" id="units" name="units" min="1" max="10" placeholder="e.g. 2" required>
                </div>
                <div class="form-group">
                    <label for="hospital">Hospital Name & Address</label>
                    <textarea class="form-control" id="hospital" name="hospital" placeholder="Enter complete hospital details where blood is needed" required></textarea>
                </div>
                <div class="form-group">
                    <label for="contact_num">Contact Mobile Number</label>
                    <input type="tel" class="form-control" id="contact_num" name="contact_num" pattern="[0-9]{10}" placeholder="Enter 10 digit active number" required>
                </div>

                
                <button type="submit" class="btn-submit">
                    <span class="btn-icon">🩸</span> Submit Blood Request
                </button>

            </form>
        </main>
        </div>
    </div>

</body>
</html>
