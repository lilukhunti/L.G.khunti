<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <title>Request Blood</title>
  <link rel="stylesheet" href="style1.css">
</head>
<body>
  <div class="form-container">
    <h2>Request Blood / Emergency</h2>
    <form action="#" method="POST">
      <input type="text" placeholder="Patient Name" required class="muto-box">
      <input type="text" placeholder="Hospital Name & City" required class="muto-box">
      <input type="tel" placeholder="Attender Phone Number" required class="muto-box">
      
      <input type="number" placeholder="Required Units" min="1" class="nano-box">
      
      <select class="nano-box">
        <option disabled selected>Required Group</option>
        <option>A+</option><option>B+</option><option>O+</option><option>AB+</option>
      </select>
      
      <button type="submit" class="submit-btn" style="background-color: #d9534f; color: white;">Submit Request</button>
      <br><br>
      <a href="index.html" class="back-link">← Back to Home</a>
    </form>
  </div>
</body>
</html>
